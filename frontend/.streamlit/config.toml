[theme]
primaryColor = "#1f77b4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f0f0"
textColor = "#262730"
font = "sans serif"

[client]
# Suppress browser warnings about unrecognized features
showErrorDetails = true
showWarningOnDirectExecution = false
toolbarMode = "minimal"

[logger]
level = "warning"

[browser]
gatherUsageStats = false

[server]
port = 8501
headless = true
runOnSave = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[client.toolbarMode]
logger.level = "error"
